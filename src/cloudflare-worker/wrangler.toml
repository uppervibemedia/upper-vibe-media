name = "uppervibemedia-og"
main = "share-worker.js"
compatibility_date = "2024-01-01"

# This worker intercepts /song/* on the main domain to serve OG meta tags to crawlers.
# Real users are passed through to the Base44 SPA — zero impact on UX.
#
# Deploy with: npx wrangler deploy
# (Make sure you're logged in: npx wrangler login)
#
# The route below attaches the worker to uppervibemedia.com/song/*
# Replace ZONE_ID with your Cloudflare zone ID for uppervibemedia.com
# (Found in Cloudflare dashboard → uppervibemedia.com → Overview → right sidebar)

[[routes]]
pattern = "uppervibemedia.com/song/*"
zone_name = "uppervibemedia.com"

[observability]
enabled = true