<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover is REQUIRED for safe-area-inset-* to work on iPhone notch/Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040408" />
    <!-- iOS PWA / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Upper Vibe" />
    <!-- Allow audio playback in both Safari and standalone mode -->
    <meta name="media-playback-requires-user-action" content="true" />
    <script>
      (function() {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark !== false) document.documentElement.classList.add('dark');
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          if (e.matches) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        });
      })();
    </script>
    <!-- OG tags for /song/:id are served server-side by the Cloudflare Worker (uppervibemedia-og).
         The worker intercepts crawler requests before this HTML loads, so no JS redirect needed. -->
    <title>Upper Vibe Media — Stream the Frequency</title>
    <meta name="description" content="Premium 432 Hz high-vibration music. Stream exclusive remastered tracks, visualizers, and live radio on Upper Vibe Media." />
    <!-- Open Graph defaults (overridden per-page by React) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Upper Vibe Media" />
    <meta property="og:title"       content="Upper Vibe Media — Stream the Frequency" />
    <meta property="og:description" content="Premium 432 Hz high-vibration music. Stream exclusive remastered tracks, visualizers, and live radio on Upper Vibe Media." />
    <meta property="og:image"       content="https://media.base44.com/images/public/69cd68afb7fe90ae92757154/10c561c0c_ChatGPTImageApr1202611_53_51AM.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type"   content="image/png" />
    <meta property="og:url"         content="https://uppervibemedia.com" />
    <!-- Twitter / X Card defaults -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@uppervibemedia" />
    <meta name="twitter:title"       content="Upper Vibe Media — Stream the Frequency" />
    <meta name="twitter:description" content="Premium 432 Hz high-vibration music. Stream exclusive remastered tracks, visualizers, and live radio on Upper Vibe Media." />
    <meta name="twitter:image"       content="https://media.base44.com/images/public/69cd68afb7fe90ae92757154/10c561c0c_ChatGPTImageApr1202611_53_51AM.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
