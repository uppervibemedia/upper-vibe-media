<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover is REQUIRED for safe-area-inset-* to work on iPhone notch/Dynamic Island -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#040408" />
    <!-- iOS PWA / Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Upper Vibe" />
    <!-- Allow audio playback in both Safari and standalone mode -->
    <meta name="media-playback-requires-user-action" content="true" />
    <script>
      (function() {
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark !== false) document.documentElement.classList.add('dark');
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
          if (e.matches) document.documentElement.classList.add('dark');
          else document.documentElement.classList.remove('dark');
        });
      })();
    </script>
    <title>Upper Vibe Music — Stream the Frequency</title>
    <meta name="description" content="Upper Vibe Music is a premium streaming platform for exclusive, high-vibration remastered tracks and unreleased soundscapes. Tap into premium sound." />
    <meta property="og:title" content="Upper Vibe Music — Stream the Frequency" />
    <meta property="og:description" content="A cognitive-enhancing audio experience. Access the vault of exclusive, high-vibration remastered tracks and unreleased soundscapes." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
